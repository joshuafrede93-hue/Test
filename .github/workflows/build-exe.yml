name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [asisten-pc]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang library
        run: pip install -r requirements.txt pyinstaller
      - name: Tes logika
        run: python -m unittest discover -s tests
      - name: Bangun exe
        run: pyinstaller --noconfirm --clean --windowed --name AsistenPC --collect-submodules comtypes --collect-submodules pywinauto --hidden-import pyperclip --hidden-import keyboard main.py
      - name: Siapkan folder hasil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/AsistenPC/data | Out-Null
          Copy-Item config.json dist/AsistenPC/config.json
          Copy-Item README.md dist/AsistenPC/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: AsistenPC-windows
          path: dist/AsistenPC
      - name: Buat zip untuk rilis
        shell: pwsh
        run: Compress-Archive -Path dist/AsistenPC -DestinationPath AsistenPC-windows.zip
      - name: Baca nomor versi
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path wa/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Terbitkan rilis
        if: github.ref == 'refs/heads/asisten-pc'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asistenpc-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Asisten PC ${{ steps.ver.outputs.version }}
          files: AsistenPC-windows.zip
          body: "Asisten PC versi ${{ steps.ver.outputs.version }}. Unduh AsistenPC-windows.zip, ekstrak, lalu jalankan AsistenPC.exe."
